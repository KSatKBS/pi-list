name: Docker image

# Builds EBU LIST (C++ analyzer, Node.js server, React GUI) and publishes the
# server image to GitHub Container Registry: ghcr.io/<owner>/pi-list

on:
  push:
    branches:
      - master
      - feature/korean-cea708-captions
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build environment
        run: docker build -t list-builder -f .github/docker/builder.Dockerfile .github/docker

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan
          key: conan-ubuntu20.04-${{ hashFiles('conanfile.txt', 'CMakeLists.txt') }}
          restore-keys: conan-ubuntu20.04-

      - name: Build LIST (release/)
        run: |
          mkdir -p ~/.conan
          docker run --rm \
            -v "$PWD:/src" -v "$HOME/.conan:/root/.conan" -w /src \
            list-builder ./scripts/deploy/deploy.sh
          sudo chown -R "$(id -u):$(id -g)" release build ~/.conan

      - name: Ancillary / Korean caption tests
        run: |
          docker run --rm \
            -v "$PWD:/src" -v "$HOME/.conan:/root/.conan" -w /src \
            list-builder bash -c '
              set -e
              mkdir -p build-tests && cd build-tests
              cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_PCH=OFF -DBUILD_TESTS=ON
              ninja ebu_list_analysis_unit_tests
              ./bin/ebu_list_analysis_unit_tests --use-colour no \
                "Scenario: Ancillary stream analysis,Scenario: CEA-708*,Scenario: KS X 1001*"'
          sudo chown -R "$(id -u):$(id -g)" build-tests ~/.conan

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: release/server
          file: release/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name == 'master' && 'latest' || 'korean-captions' }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=EBU LIST with Korean (KS X 1001) CEA-708 caption decoding

      - name: Smoke test (compose up, register, login, upload, read captions)
        run: .github/scripts/smoke_test.sh "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
